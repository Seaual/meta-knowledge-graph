<div class="options" style="margin-top: 24px;">
  <div class="option" data-choice="multi-center" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>多中心放射</h3>
      <p>每个根概念形成独立的放射单元，清晰展示知识领域边界</p>
    </div>
  </div>

  <div class="option" data-choice="virtual-center" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>虚拟中心</h3>
      <p>所有根概念围绕一个虚拟中心点排列，整体更紧凑统一</p>

  </div>
