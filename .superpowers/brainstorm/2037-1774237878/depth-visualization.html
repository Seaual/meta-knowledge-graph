<h2>层级深度可视化</h2>
<p class="subtitle">如何展示概念之间的层级关系（领域 > 方向 > 子方向 > 任务 > 方法 > 技术）？</p>

<div class="split">
  <div class="mockup">
    <div class="mockup-header">方案 A：同心环</div>
    <div class="mockup-body" style="min-height: 220px; background: #f8fafc;">
      <svg width="100%" height="200" viewBox="0 0 240 200">
        <!-- Concentric rings -->
        <circle cx="120" cy="100" r="30" fill="none" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="120" cy="100" r="55" fill="none" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="120" cy="100" r="80" fill="none" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="120" cy="100" r="105" fill="none" stroke="#E2E8F0" stroke-width="1"/>
        <!-- Ring labels -->
        <text x="120" y="20" text-anchor="middle" fill="#94A3B8" font-size="9">领域</text>
        <text x="120" y="45" text-anchor="middle" fill="#94A3B8" font-size="9">方向</text>
        <text x="120" y="70" text-anchor="middle" fill="#94A3B8" font-size="9">子方向</text>
        <text x="120" y="95" text-anchor="middle" fill="#94A3B8" font-size="9">任务</text>
        <!-- Nodes on rings -->
        <circle cx="120" cy="100" r="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2"/>
        <circle cx="120" cy="70" r="12" fill="#FF6B6B"/>
        <circle cx="150" cy="100" r="12" fill="#45B7D1"/>
        <circle cx="90" cy="100" r="12" fill="#4ECDC4"/>
        <circle cx="120" cy="130" r="12" fill="#FFA726"/>
        <circle cx="140" cy="55" r="9" fill="#96CEB4" opacity="0.8"/>
        <circle cx="100" cy="55" r="9" fill="#FFD93D" opacity="0.8"/>
        <circle cx="165" cy="85" r="9" fill="#FF6B6B" opacity="0.8"/>
        <circle cx="75" cy="85" r="9" fill="#45B7D1" opacity="0.8"/>
        <circle cx="140" cy="145" r="9" fill="#4ECDC4" opacity="0.8"/>
        <circle cx="100" cy="145" r="9" fill="#FFA726" opacity="0.8"/>
        <circle cx="175" cy="100" r="7" fill="#96CEB4" opacity="0.6"/>
        <circle cx="65" cy="100" r="7" fill="#FFD93D" opacity="0.6"/>
      </svg>
    </div>
    <div style="text-align: center; color: #64748b; font-size: 11px; padding: 8px;">每一层对应一个同心环，层级越深环越大</div>
  </div>

  <div class="mockup">
    <div class="mockup-header">方案 B：扇区分组</div>
    <div class="mockup-body" style="min-height: 220px; background: #f8fafc;">
      <svg width="100%" height="200" viewBox="0 0 240 200">
        <!-- Sector backgrounds -->
        <path d="M120,100 L120,10 A90,90 0 0,1 210,100 Z" fill="#FEE2E2" opacity="0.5"/>
        <path d="M120,100 L210,100 A90,90 0 0,1 120,190 Z" fill="#CCFBF1" opacity="0.5"/>
        <path d="M120,100 L120,190 A90,90 0 0,1 30,100 Z" fill="#E0F2FE" opacity="0.5"/>
        <path d="M120,100 L30,100 A90,90 0 0,1 120,10 Z" fill="#FEF9C3" opacity="0.5"/>
        <!-- Virtual center -->
        <circle cx="120" cy="100" r="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2"/>
        <!-- Root concepts (first ring) -->
        <circle cx="120" cy="55" r="14" fill="#FF6B6B"/>
        <circle cx="165" cy="100" r="14" fill="#4ECDC4"/>
        <circle cx="120" cy="145" r="14" fill="#45B7D1"/>
        <circle cx="75" cy="100" r="14" fill="#FFA726"/>
        <!-- Second ring nodes -->
        <circle cx="145" cy="45" r="10" fill="#96CEB4" opacity="0.8"/>
        <circle cx="175" cy="80" r="10" fill="#FFD93D" opacity="0.8"/>
        <circle cx="175" cy="120" r="10" fill="#FF6B6B" opacity="0.8"/>
        <circle cx="145" cy="155" r="10" fill="#45B7D1" opacity="0.8"/>
        <circle cx="95" cy="155" r="10" fill="#4ECDC4" opacity="0.8"/>
        <circle cx="65" cy="120" r="10" fill="#FFA726" opacity="0.8"/>
        <circle cx="65" cy="80" r="10" fill="#96CEB4" opacity="0.8"/>
        <circle cx="95" cy="45" r="10" fill="#FFD93D" opacity="0.8"/>
      </svg>
    </div>
    <div style="text-align: center; color: #64748b; font-size: 11px; padding: 8px;">每个根概念占据一个扇区，子概念在扇区内展开</div>
  </div>
</div>

<div class="options" style="margin-top: 24px;">
  <div class="option" data-choice="rings" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>同心环分层</h3>
      <p>层级用同心环表示，所有同层级概念在同一环上，视觉上清晰区分层级</p>
    </div>
  </div>

  <div class="option" data-choice="sectors" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>扇区分组</h3>
      <p>每个根概念占据一个扇区，其子概念在扇区内向外展开，领域边界更清晰</p>
    </div>
  </div>

  <div class="option" data-choice="hybrid" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>混合模式</h3>
      <p>同心环 + 扇区背景，同时展示层级和领域分组</p>
    </div>
  </div>
</div>
