<h2>交互方式设计</h2>
<p class="subtitle">用户如何与这个放射状分层图谱交互？</p>

<div class="section">
  <div class="mockup" style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); border-radius: 16px; overflow: hidden;">
    <div class="mockup-body" style="min-height: 280px; position: relative;">
      <svg width="100%" height="260" viewBox="0 0 400 260">
        <!-- Concentric rings -->
        <circle cx="200" cy="130" r="40" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4"/>
        <circle cx="200" cy="130" r="75" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4"/>
        <circle cx="200" cy="130" r="110" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4"/>
        <!-- Sector backgrounds -->
        <path d="M200,130 L200,20 A110,110 0 0,1 310,130 Z" fill="#FEE2E2" opacity="0.3"/>
        <path d="M200,130 L310,130 A110,110 0 0,1 200,240 Z" fill="#CCFBF1" opacity="0.3"/>
        <path d="M200,130 L200,240 A110,110 0 0,1 90,130 Z" fill="#E0F2FE" opacity="0.3"/>
        <path d="M200,130 L90,130 A110,110 0 0,1 200,20 Z" fill="#FEF9C3" opacity="0.3"/>
        <!-- Virtual center -->
        <circle cx="200" cy="130" r="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3"/>
        <!-- Root concepts (field) on first ring -->
        <circle cx="200" cy="90" r="18" fill="#FF6B6B"/>
        <text x="200" y="94" text-anchor="middle" fill="white" font-size="9" font-weight="bold">CS</text>
        <circle cx="240" cy="130" r="18" fill="#4ECDC4"/>
        <circle cx="200" cy="170" r="18" fill="#45B7D1"/>
        <circle cx="160" cy="130" r="18" fill="#FFA726"/>
        <!-- Direction level nodes -->
        <circle cx="230" cy="55" r="12" fill="#96CEB4"/>
        <circle cx="275" cy="100" r="12" fill="#FFD93D"/>
        <circle cx="275" cy="160" r="12" fill="#FF6B6B" opacity="0.7"/>
        <circle cx="230" cy="205" r="12" fill="#45B7D1" opacity="0.7"/>
        <circle cx="170" cy="205" r="12" fill="#4ECDC4" opacity="0.7"/>
        <circle cx="125" cy="160" r="12" fill="#FFA726" opacity="0.7"/>
        <circle cx="125" cy="100" r="12" fill="#96CEB4" opacity="0.7"/>
        <circle cx="170" cy="55" r="12" fill="#FFD93D" opacity="0.7"/>
        <!-- Task level nodes (outer) -->
        <circle cx="250" cy="30" r="8" fill="#94A3B8"/>
        <circle cx="300" cy="60" r="8" fill="#94A3B8"/>
        <circle cx="320" cy="130" r="8" fill="#94A3B8"/>
        <circle cx="300" cy="200" r="8" fill="#94A3B8"/>
        <circle cx="200" cy="240" r="8" fill="#94A3B8"/>
        <circle cx="100" cy="200" r="8" fill="#94A3B8"/>
        <circle cx="80" cy="130" r="8" fill="#94A3B8"/>
        <circle cx="100" cy="60" r="8" fill="#94A3B8"/>
        <circle cx="150" cy="30" r="8" fill="#94A3B8"/>
        <!-- Edges -->
        <line x1="200" y1="130" x2="200" y2="90" stroke="#CBD5E1" stroke-width="1.5"/>
        <line x1="200" y1="130" x2="240" y2="130" stroke="#CBD5E1" stroke-width="1.5"/>

        <line x1="200" y1="90" x2="170" y2="55" stroke="#CBD5E1" stroke-width="1"/>
      </svg>
      <!-- Zoom indicator -->
      <div style="position: absolute; bottom: 8px; right: 8px; background: white; padding: 4px 8px; border-radius: 8px; font-size: 10px; color: #64748b;">
        🔍 可缩放平移
      </div>
    </div>
  </div>
</div>

<h3>选择主要的交互方式</h3>

<div class="options">
  <div class="option" data-choice="click-drill" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>点击钻取</h3>
      <p>点击任意节点后，以该节点为中心重新布局，只显示其子概念树（类似当前双击进入详情）</p>
    </div>
  </div>

  <div class="option" data-choice="hover-expand" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>悬停展开</h3>
      <p>鼠标悬停在节点上时，高亮显示该节点的完整子树路径，其他节点变淡</p>
    </div>
  </div>

  <div class="option" data-choice="filter-level" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>层级筛选器</h3>
      <p>提供滑块或按钮选择显示的层级范围，比如只看 L0-L2，或全部展开</p>
    </div>
  </div>

  <div class="option" data-choice="all" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>全部都要</h3>
      <p>以上三种交互都需要，可以组合使用</p>
    </div>
  </div>
</div>
