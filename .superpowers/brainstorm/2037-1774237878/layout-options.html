<h2>分层网状结构布局方案</h2>
<p class="subtitle">当前概念页面使用力导向布局，你想改成什么样的分层结构？</p>

<div class="section" style="margin-bottom: 24px;">
  <div class="label">当前布局</div>
  <div class="mockup" style="background: #f8fafc;">
    <div class="mockup-body" style="min-height: 180px; display: flex; align-items: center; justify-content: center;">
      <svg width="400" height="160" viewBox="0 0 400 160">
        <!-- Force-directed scattered nodes -->
        <circle cx="80" cy="50" r="20" fill="#FF6B6B" opacity="0.8"/>
        <circle cx="150" cy="90" r="15" fill="#4ECDC4" opacity="0.8"/>
        <circle cx="220" cy="40" r="18" fill="#45B7D1" opacity="0.8"/>
        <circle cx="280" cy="100" r="12" fill="#96CEB4" opacity="0.8"/>
        <circle cx="340" cy="60" r="16" fill="#FFA726" opacity="0.8"/>
        <circle cx="120" cy="130" r="14" fill="#FFD93D" opacity="0.8"/>
        <circle cx="200" cy="110" r="10" fill="#FF6B6B" opacity="0.8"/>
        <circle cx="320" cy="130" r="13" fill="#4ECDC4" opacity="0.8"/>
        <!-- Edges -->
        <line x1="80" y1="50" x2="150" y2="90" stroke="#CBD5E1" stroke-width="2"/>
        <line x1="150" y1="90" x2="220" y2="40" stroke="#CBD5E1" stroke-width="2"/>
        <line x1="220" y1="40" x2="280" y2="100" stroke="#CBD5E1" stroke-width="2"/>
        <line x1="150" y1="90" x2="120" y2="130" stroke="#CBD5E1" stroke-width="2"/>
        <line x1="280" y1="100" x2="340" y2="60" stroke="#CBD5E1" stroke-width="2"/>
        <line x1="280" y1="100" x2="320" y2="130" stroke="#CBD5E1" stroke-width="2"/>
        <line x1="200" y1="110" x2="150" y2="90" stroke="#CBD5E1" stroke-width="2"/>
      </svg>
    </div>
    <div style="text-align: center; color: #64748b; font-size: 12px;">力导向布局 - 节点自由散布</div>
  </div>
</div>

<h3>选择你想要的分层方式</h3>

<div class="options">
  <div class="option" data-choice="radial" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>放射状层级</h3>
      <p>根概念在中心，子概念向外辐射成环状，层级越深距离中心越远</p>
    </div>
  </div>

  <div class="option" data-choice="vertical" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>垂直分层</h3>
      <p>顶层领域在最上面，方向、子方向、任务等逐层向下排列，类似组织架构图</p>
    </div>
  </div>

  <div class="option" data-choice="sugiyama" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>Sugiyama 算法分层</h3>
      <p>经典有向图分层算法，自动计算最优层次分配，减少边交叉，适合复杂网络</p>
    </div>
  </div>

  <div class="option" data-choice="clustered" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>聚类分组布局</h3>
      <p>按领域聚类，每个领域内的概念用力导向布局，领域之间有清晰的边界和连接</p>
    </div>
  </div>
</div>

<div class="section" style="margin-top: 24px;">
  <p style="color: #64748b; font-size: 13px;">💡 提示：可以点击选择，或者在终端描述你想要的布局效果</p>
</div>
