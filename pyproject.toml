[tool.ruff]
target-version = "py310"
line-length = 120
src = ["backend", "mkg", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "mkg"]

[tool.pyright]
include = ["backend", "mkg"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
