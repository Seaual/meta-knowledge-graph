services:
  mkg:
    image: danceinsophy/meta-knowledge-graph:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: meta-knowledge-graph
    ports:
      - "8088:8088"
    volumes:
      # Persist data
      - mkg-data:/app/data
      - mkg-papers:/app/papers
      # Persist database
      - mkg-db:/app
    environment:
      - PYTHONUNBUFFERED=1
      - FRONTEND_DIST=/app/frontend/dist
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/graph/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mkg-data:
    name: mkg-data
  mkg-papers:
    name: mkg-papers
  mkg-db:
    name: mkg-db